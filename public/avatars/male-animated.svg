<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="skinGradMale" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4" />
      <stop offset="100%" stop-color="#F0B27A" />
    </linearGradient>
    <linearGradient id="hairGradMale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="hoodieGradMale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B4EFF" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <filter id="glowMale" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4F933" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    @keyframes floatHead {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3.5px); }
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes pulseAura {
      0%, 100% { opacity: 0.4; r: 76px; }
      50% { opacity: 0.8; r: 78px; }
    }
    .head-group {
      animation: floatHead 3.2s ease-in-out infinite;
      transform-origin: 80px 90px;
    }
    .eye {
      animation: blink 4.5s ease-in-out infinite;
      transform-origin: 80px 78px;
    }
    .pulse-ring {
      animation: pulseAura 3s ease-in-out infinite;
      transform-origin: 80px 80px;
    }
  </style>

  <!-- Background Base Circle -->
  <circle cx="80" cy="80" r="76" fill="url(#bgGradMale)" />
  <circle class="pulse-ring" cx="80" cy="80" r="76" fill="none" stroke="#D4F933" stroke-width="2" stroke-dasharray="8 6" opacity="0.5" />

  <!-- Animated Head & Body Group -->
  <g class="head-group">
    <!-- Hoodie / Shoulders -->
    <path d="M 30 155 C 32 122, 50 112, 80 112 C 110 112, 128 122, 130 155 Z" fill="url(#hoodieGradMale)" />
    <!-- Hoodie Strings / Collar Accent -->
    <path d="M 68 114 L 66 138" stroke="#D4F933" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 92 114 L 94 138" stroke="#D4F933" stroke-width="2.5" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="71" y="94" width="18" height="22" rx="6" fill="#F0B27A" />

    <!-- Head / Face -->
    <ellipse cx="80" cy="78" rx="30" ry="34" fill="url(#skinGradMale)" />

    <!-- Ears -->
    <circle cx="49" cy="78" r="7.5" fill="#F0B27A" />
    <circle cx="111" cy="78" r="7.5" fill="#F0B27A" />

    <!-- Modern Stylish Hair -->
    <path d="M 48 70 C 48 44, 62 34, 80 34 C 100 34, 114 46, 114 70 C 106 60, 96 66, 80 62 C 64 66, 54 60, 48 70 Z" fill="url(#hairGradMale)" />
    <!-- Front Hair Tufts -->
    <path d="M 52 64 C 62 52, 78 50, 88 56 C 82 52, 70 50, 60 58 Z" fill="#475569" />

    <!-- Eyebrows -->
    <path d="M 62 67 Q 70 65 74 68" stroke="#1E293B" stroke-width="2.8" stroke-linecap="round" fill="none" />
    <path d="M 86 68 Q 90 65 98 67" stroke="#1E293B" stroke-width="2.8" stroke-linecap="round" fill="none" />

    <!-- Eyes (Animated Blink) -->
    <g class="eye">
      <ellipse cx="68" cy="76" rx="4.2" ry="4.8" fill="#0F172A" />
      <circle cx="66.5" cy="74.5" r="1.5" fill="#FFFFFF" />

      <ellipse cx="92" cy="76" rx="4.2" ry="4.8" fill="#0F172A" />
      <circle cx="90.5" cy="74.5" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Nose -->
    <path d="M 80 77 L 78 84 L 82 84" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6" />

    <!-- Smile -->
    <path d="M 72 90 Q 80 97 88 90" stroke="#9A3412" stroke-width="2.4" stroke-linecap="round" fill="none" />

    <!-- Tech Earbud (Left Ear) -->
    <circle cx="49" cy="80" r="3.5" fill="#D4F933" filter="url(#glowMale)" />
    <path d="M 49 80 L 47 88" stroke="#D4F933" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
